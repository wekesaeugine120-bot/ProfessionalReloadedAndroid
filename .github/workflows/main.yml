name: Build Professional Reloaded Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=\( (dirname " \)(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found in ZIP"
            ls -la extracted
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Grant execute permission for gradlew
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Reloaded-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
            **/*.apk
