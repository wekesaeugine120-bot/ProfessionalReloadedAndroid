name: Build Professional Reloaded Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project from ZIP
        run: |
          echo "=== Repository contents ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ERROR: No .zip file found in the root of the repository"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Extracted contents ==="
          find extracted -maxdepth 4 -type f

          # Locate the real project root (where settings.gradle* lives)
          SETTINGS_FILE=$(find extracted -name "settings.gradle*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ ERROR: Could not find settings.gradle or settings.gradle.kts inside the ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✅ Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'   # Matches AGP 8.7.3 requirement

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          echo "Building from directory: $(pwd)"
          echo "Files in project root:"
          ls -la

          # No gradlew in the ZIP, so we use the Gradle installed by setup-gradle
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Reloaded-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
